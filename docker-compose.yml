services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    environment:
      - MEILI_ENV=production
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - MEILI_NO_ANALYTICS=${MEILI_NO_ANALYTICS:-true}
    volumes:
      - meili_data:/meili_data
      - hf_cache:/tmp/huggingface_cache
    ports:
      - "127.0.0.1:7700:7700"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wordpress:
    build: .
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=${WORDPRESS_DB_USER:-wp}
      - WORDPRESS_DB_PASSWORD=${WORDPRESS_DB_PASSWORD}
      - WORDPRESS_DB_NAME=${WORDPRESS_DB_NAME:-wp_memlog}
    volumes:
      - wp_data:/var/www/html
    ports:
      - "127.0.0.1:8080:80"
    command: apache2-foreground
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/wp-json/wp/v2/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  db:
    image: mariadb:11.4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-wp_memlog}
      - MYSQL_USER=${MYSQL_USER:-wp}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_CHARSET=utf8mb4
      - MYSQL_COLLATION=utf8mb4_unicode_ci
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  meili_data:
    labels:
      com.wp-memlog.protect: "true"
  wp_data:
    labels:
      com.wp-memlog.protect: "true"
  db_data:
    labels:
      com.wp-memlog.protect: "true"
  hf_cache:
